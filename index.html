<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAZRA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#050505;color:#fff}
header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 7%;border-bottom:1px solid #222;position:sticky;top:0;background:rgba(5,5,5,.94);z-index:10}
..logo{width:140px;height:auto;display:block}
nav a{color:#fff;text-decoration:none;margin-left:28px;font-size:14px}
.hero{min-height:78vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:70px 20px;background:radial-gradient(circle at center,#171717 0,#050505 55%)}
.hero h1{font-family:Georgia,serif;font-size:clamp(64px,15vw,150px);font-weight:400;letter-spacing:12px;margin-bottom:18px}
.hero p{color:#aaa;letter-spacing:4px;font-size:12px;margin-bottom:34px;text-transform:uppercase}
.btn{display:inline-block;background:#fff;color:#050505;text-decoration:none;padding:16px 34px;font-size:13px;letter-spacing:2px;font-weight:bold}
.section{padding:70px 7%}
.section h2{text-align:center;font-family:Georgia,serif;font-weight:400;font-size:36px;margin-bottom:45px}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{background:#101010;border:1px solid #222;padding-bottom:24px}
.product-img{height:360px;background:linear-gradient(145deg,#1b1b1b,#080808);display:flex;align-items:center;justify-content:center;color:#555;letter-spacing:3px;font-size:12px}
.card-info{padding:20px 20px 0}
.card h3{font-size:15px;font-weight:400;letter-spacing:2px;margin-bottom:10px}
.price{font-size:13px;color:#aaa}
footer{text-align:center;padding:45px 20px;border-top:1px solid #222;color:#666;font-size:11px;letter-spacing:2px}
@media(max-width:700px){header{padding:0 20px}.logo{font-size:24px;letter-spacing:5px}nav a{margin-left:12px;font-size:11px}.products{grid-template-columns:1fr}.product-img{height:330px}.section{padding:55px 20px}}
</style>
</head>
<body>
<header>
  <img src="Logo.PNG" alt="NAZRA" class="logo">
  <nav><a href="#shop">SHOP</a><a href="#contact">CONTACT</a></nav>
</header>

<section class="hero">
  <div>
    <h1>NAZRA</h1>
    <p>Minimal. Bold. Different.</p>
    <a class="btn" href="#shop">SHOP NOW</a>
  </div>
</section>

<section class="section" id="shop">
  <h2>COLLECTION</h2>
  <div class="products">
    <div class="card"><div class="product-img">PRODUCT 01</div><div class="card-info"><h3>NAZRA HOODIE</h3><div class="price">0 EGP</div></div></div>
    <div class="card"><div class="product-img">PRODUCT 02</div><div class="card-info"><h3>NAZRA TEE</h3><div class="price">0 EGP</div></div></div>
    <div class="card"><div class="product-img">PRODUCT 03</div><div class="card-info"><h3>NAZRA COLLECTION</h3><div class="price">0 EGP</div></div></div>
  </div>
</section>

<footer id="contact">NAZRA © 2026 — ALL RIGHTS RESERVED</footer>
</body>
</html>
