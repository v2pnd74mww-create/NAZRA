<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAZRA</title>

<style>
:root{
  --bg:#050505;
  --panel:#0c0c0c;
  --card:#111;
  --line:#262626;
  --text:#f5f1e8;
  --muted:#969696;
  --gold:#b7a16b;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:70px;
  z-index:50;
  background:rgba(5,5,5,.86);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  font:28px Georgia,serif;
  letter-spacing:9px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--line);
  background:#0a0a0a;
  color:var(--text);
  border-radius:50%;
  position:relative;
}

.icon-btn span{
  position:absolute;
  right:-5px;
  top:-5px;
  background:var(--gold);
  color:#111;
  border-radius:50%;
  min-width:17px;
  height:17px;
  font-size:9px;
  line-height:17px;
}

/* HERO */

.hero{
  min-height:760px;
  padding:130px 24px 80px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(
      circle at 76% 45%,
      #28231c 0,
      #11100e 20%,
      #070707 54%,
      #000 80%
    );
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"";
  position:absolute;
  right:-80px;
  top:150px;
  width:310px;
  height:470px;
  border-radius:170px 170px 0 0;
  background:
    radial-gradient(
      circle at 55% 15%,
      #6b6252 0,
      #29261f 24%,
      #090909 65%
    );
  opacity:.5;
}

.hero-content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:680px;
}

.eyebrow{
  font-size:10px;
  letter-spacing:5px;
  color:var(--muted);
  text-transform:uppercase;
}

.hero-logo{
  width:min(78vw,440px);
  max-height:180px;
  object-fit:contain;
  margin:22px 0 24px;
}

.hero h1{
  font:clamp(46px,12vw,92px) Georgia,serif;
  letter-spacing:8px;
}

.hero-tag{
  font-size:12px;
  letter-spacing:6px;
  color:#aaa;
  margin:12px 0 32px;
}

.primary{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--text);
  padding:17px 25px;
  letter-spacing:4px;
  text-transform:uppercase;
  min-height:54px;
}

.primary:hover{
  background:var(--gold);
  color:#090909;
}

/* COLLECTION */

.section{
  padding:76px 20px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:25px;
}

.section-title{
  font:34px Georgia,serif;
  letter-spacing:5px;
}

.view{
  font-size:10px;
  letter-spacing:2px;
  color:var(--gold);
  background:none;
  border:0;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  max-width:1100px;
  margin:auto;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.photo{
  aspect-ratio:1/1.12;
  background:
    radial-gradient(
      circle at 50% 35%,
      #30302f,
      #151515 48%,
      #090909
    );
  display:grid;
  place-items:center;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font:28px Georgia,serif;
  letter-spacing:5px;
  color:#aaa;
}

.card-info{
  padding:15px;
}

.card-name{
  font-size:12px;
  letter-spacing:2px;
}

.price{
  font-size:12px;
  color:var(--muted);
  margin-top:7px;
}

.add{
  width:100%;
  margin-top:13px;
  padding:12px;
  background:#eee;
  color:#090909;
  border:0;
  font-size:11px;
  letter-spacing:2px;
}

/* FOOTER */

.footer{
  border-top:1px solid var(--line);
  padding:28px 20px;
  color:#777;
  font-size:10px;
  letter-spacing:3px;
  display:flex;
  justify-content:flex-start;
}

.footer strong{
  font:20px Georgia,serif;
  letter-spacing:7px;
  color:#ddd;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  z-index:60;
  background:rgba(5,5,5,.96);
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.bottom button{
  background:none;
  border:0;
  color:#aaa;
  font-size:9px;
  letter-spacing:1px;
  display:flex;
  flex-direction:column;
  gap:5px;
  align-items:center;
}

.bottom b{
  font-size:18px;
  font-weight:400;
  color:#ddd;
}

/* MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(10px);
  z-index:100;
  display:none;
  align-items:flex-start;
  justify-content:center;
  padding:82px 14px 88px;
  overflow:auto;
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(620px,100%);
  background:
    linear-gradient(
      145deg,
      #111,
      #080808
    );
  border:1px solid #333;
  border-radius:16px;
  position:relative;
  box-shadow:0 20px 80px #000;
  padding:25px;
}

.close{
  position:absolute;
  right:16px;
  top:14px;
  width:38px;
  height:38px;
  border:0;
  background:none;
  color:#ddd;
  font-size:28px;
}

.modal h2{
  font:30px Georgia,serif;
  letter-spacing:5px;
  margin-bottom:22px;
  text-align:center;
}

.rule{
  height:1px;
  background:#333;
  margin:15px 0 22px;
}

/* STORY / POLICY / FAQ */

.story p,
.policy p{
  color:#c8c4bc;
  line-height:1.75;
  font-size:13px;
  margin-bottom:16px;
}

.arabic{
  direction:rtl;
  text-align:right;
}

.arabic p{
  font-size:14px;
}

.faq details{
  border-bottom:1px solid #2a2a2a;
  padding:15px 0;
}

.faq summary{
  cursor:pointer;
  font-size:12px;
}

.faq p{
  color:#aaa;
  margin-top:10px;
  line-height:1.6;
  font-size:12px;
}

/* FORMS */

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:12px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:10px;
  letter-spacing:1.5px;
  color:#aaa;
  margin-bottom:7px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  background:#080808;
  color:#eee;
  border:1px solid #333;
  border-radius:8px;
  padding:13px;
  outline:none;
}

.field textarea{
  min-height:110px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--gold);
}

.req{
  color:#c99;
}

.form-note{
  font-size:10px;
  color:#777;
  line-height:1.5;
  margin:8px 0 14px;
}

.submit{
  width:100%;
  padding:14px;
  border:1px solid #444;
  background:#eee;
  color:#080808;
  letter-spacing:2px;
  font-size:11px;
}

.submit:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* LIST BUTTONS */

.type-list{
  display:grid;
  gap:8px;
}

.type-list button,
.type-list a{
  padding:14px;
  text-align:left;
  background:#0a0a0a;
  border:1px solid #2b2b2b;
  color:#ddd;
  border-radius:8px;
  letter-spacing:1px;
}

.type-list button:hover,
.type-list a:hover{
  border-color:var(--gold);
}

.back-link{
  display:inline-block;
  margin:0 0 18px;
  color:#aaa;
  font-size:10px;
  letter-spacing:2px;
}

/* CART */

.cart-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-bottom:1px solid #2a2a2a;
  padding:14px 0;
  font-size:12px;
}

.cart-empty{
  text-align:center;
  color:#888;
  padding:25px;
}

.total{
  display:flex;
  justify-content:space-between;
  margin:18px 0;
  font-size:13px;
}

/* AI */

.chat-launch{
  position:fixed;
  right:16px;
  bottom:82px;
  z-index:70;
  width:62px;
  height:62px;
  border:1px solid var(--gold);
  border-radius:50%;
  background:#090909;
  color:#eee;
  box-shadow:0 8px 30px #000;
}

.chat-launch span{
  display:block;
  font:22px Georgia,serif;
}

.chat-launch small{
  font-size:7px;
  letter-spacing:1px;
}

.chat-panel{
  position:fixed;
  right:14px;
  bottom:155px;
  width:min(360px,calc(100vw - 28px));
  height:450px;
  z-index:80;
  background:#0b0b0b;
  border:1px solid #333;
  border-radius:15px;
  display:none;
  flex-direction:column;
  box-shadow:0 20px 70px #000;
}

.chat-panel.show{
  display:flex;
}

.chat-head{
  padding:14px 16px;
  border-bottom:1px solid #292929;
  display:flex;
  justify-content:space-between;
}

.chat-head strong{
  font:18px Georgia,serif;
  letter-spacing:2px;
}

.chat-body{
  padding:14px;
  overflow:auto;
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.bubble{
  max-width:84%;
  padding:10px 12px;
  border-radius:10px;
  background:#181818;
  color:#ddd;
  font-size:12px;
  line-height:1.45;
}

.bubble.user{
  align-self:flex-end;
  background:#ddd;
  color:#111;
}

.chat-input{
  display:flex;
  border-top:1px solid #292929;
}

.chat-input input{
  flex:1;
  background:#090909;
  color:#fff;
  border:0;
  padding:13px;
}

.chat-input button{
  width:54px;
  border:0;
  background:#eee;
  color:#111;
}

/* DRAWER */

.drawer{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
}

.drawer.show{
  display:block;
}

.drawer-bg{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.65);
}

.drawer-panel{
  position:absolute;
  top:0;
  left:0;
  bottom:0;
  width:min(310px,84vw);
  background:#090909;
  border-right:1px solid #333;
  padding:90px 22px 30px;
}

.drawer-panel button{
  display:block;
  width:100%;
  padding:17px 4px;
  border:0;
  border-bottom:1px solid #222;
  background:none;
  color:#ddd;
  text-align:left;
  letter-spacing:2px;
  font-size:11px;
}

/* MOBILE */

@media(max-width:680px){

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .hero{
    min-height:720px;
  }

  .hero h1{
    font-size:48px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .section{
    padding:62px 14px;
  }

  .card-info{
    padding:12px;
  }

  .add{
    font-size:9px;
  }

  .modal{
    padding:22px 16px;
  }

  .brand{
    font-size:23px;
  }

  .hero:after{
    right:-130px;
    opacity:.4;
  }
}

@media(max-width:420px){

  .products{
    grid-template-columns:1fr;
  }

  .hero-logo{
    width:85vw;
  }

  .hero-tag{
    letter-spacing:4px;
  }
}
</style>
</head>

<body>

<header class="header">

  <button class="icon-btn" id="menuBtn">
    ☰
  </button>

  <div class="brand">
    NAZRA
  </div>

  <button class="icon-btn" id="cartTop">
    ♧
    <span id="cartCount">0</span>
  </button>

</header>


<main>

<section class="hero" id="home">

  <div class="hero-content">

    <div class="eyebrow">
      NAZRA
    </div>

    <img
      class="hero-logo"
      src="Logo.PNG"
      alt="NAZRA logo"
      onerror="this.style.display='none'"
    >

    <h1>
      NAZRA
    </h1>

    <div class="hero-tag">
      MINIMAL. BOLD. DIFFERENT.
    </div>

    <button class="primary" id="collectionsBtn">
      TO COLLECTIONS →
    </button>

  </div>

</section>


<section class="section" id="shop">

  <div class="section-head">

    <h2 class="section-title">
      COLLECTIONS
    </h2>

    <button class="view" id="allProducts">
      VIEW ALL →
    </button>

  </div>

  <div class="products" id="products"></div>

</section>

</main>


<footer class="footer">
  <strong>
    NAZRA
  </strong>
</footer>


<!-- BOTTOM NAV -->

<nav class="bottom">

  <button data-open="home">
    <b>⌂</b>
    HOME
  </button>

  <button id="bottomCart">
    <b>♧</b>
    CART
  </button>

  <button data-open="contact">
    <b>⌕</b>
    CONTACT
  </button>

  <button data-open="reports">
    <b>▥</b>
    REPORTS
  </button>

  <button data-open="story">
    <b>N</b>
    STORY
  </button>

  <button data-open="policy">
    <b>◇</b>
    POLICY
  </button>

  <button data-open="faq">
    <b>?</b>
    FAQ
  </button>

</nav>


<!-- AI -->

<button class="chat-launch" id="chatLaunch">
  <span>N</span>
  <small>AI CHAT</small>
</button>


<div class="chat-panel" id="chatPanel">

  <div class="chat-head">

    <strong>
      NAZRA AI
    </strong>

    <button class="close" id="chatClose">
      ×
    </button>

  </div>

  <div class="chat-body" id="chatBody"></div>

  <form class="chat-input" id="chatForm">

    <input
      id="chatInput"
      autocomplete="off"
      placeholder="Ask NAZRA AI..."
    >

    <button>
      ➤
    </button>

  </form>

</div>


<!-- DRAWER -->

<div class="drawer" id="drawer">

  <div class="drawer-bg" id="drawerBg"></div>

  <aside class="drawer-panel">

    <button data-open="home">
      HOME
    </button>

    <button id="drawerCart">
      CART
    </button>

    <button data-open="contact">
      CONTACT
    </button>

    <button data-open="reports">
      REPORTS
    </button>

    <button data-open="story">
      NAZRA STORY
    </button>

    <button data-open="policy">
      POLICY
    </button>

    <button data-open="faq">
      FAQ
    </button>

  </aside>

</div>


<!-- MODAL -->

<div class="overlay" id="modalOverlay">

  <div class="modal" id="modal"></div>

</div>


<script>

/* PRODUCTS */

const products = [

  {
    id:1,
    name:"NAZRA HOODIE",
    price:0,
    img:"product1.jpg"
  },

  {
    id:2,
    name:"NAZRA TEE",
    price:0,
    img:"product2.jpg"
  },

  {
    id:3,
    name:"NAZRA COLLECTION",
    price:0,
    img:"product3.jpg"
  }

];


let cart = [];


/* STORY */

const storyEn = [

"There are things you do not see when you look at them but only when you look through them. We do not always remember faces and we do not always remember the words that were said but we remember one gaze that changed something inside us without knowing how.",

"A gaze is not a moment. It is a meaning. It is a feeling that passes between two people without a sound and a small detail that may remain in memory longer than it should.",

"This is where NAZRA came from. Not to tell you who you are and not to give you a shape to wear but to leave you the space to say something about yourself without speaking.",

"We believe true difference does not need to ask for attention and what truly catches the eye is not what tries to be seen but what makes you look twice.",

"NAZRA. Because some things are not understood the first time."

];


const storyAr = [

"هناك أشياء لا ترى حين تنظر إليها بل ترى حين تنظر من خلالها. نحن لا نتذكر الوجوه دائما ولا نتذكر الكلمات التي قيلت لكننا نتذكر نظرة واحدة غيرت شيئا بداخلنا دون أن نعرف كيف.",

"النظرة ليست لحظة. هي معنى. هي شعور يمر بين شخصين دون صوت وتفصيلة صغيرة قد تظل عالقة في الذاكرة أطول مما ينبغي.",

"ومن هنا جاءت NAZRA. ليس لنقول لك من تكون ولا لنضع لك شكلا ترتديه بل لنترك لك مساحة أن تقول شيئا عن نفسك دون أن تنطق.",

"نؤمن أن الاختلاف الحقيقي لا يحتاج إلى أن يطلب الانتباه وأن ما يلفت النظر حقا ليس ما يحاول أن يرى بل ما يجعلك تنظر مرة أخرى.",

"NAZRA. لأن بعض الأشياء لا تفهم من المرة الأولى."

];


/* MODALS */

function openModal(html){

  modal.innerHTML = html;

  modalOverlay.classList.add("show");

}


function closeModal(){

  modalOverlay.classList.remove("show");

  modal.innerHTML = "";

}


function shell(title,body){

  return `

    <button
      class="close"
      onclick="closeModal()"
    >
      ×
    </button>

    <h2>${title}</h2>

    ${body}

  `;

}


/* PRODUCTS */

function renderProducts(){

  productsEl.innerHTML = products.map(p => `

    <article class="card">

      <div class="photo">

        <img
          src="${p.img}"
          alt="${p.name}"
          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='block'
          "
        >

        <div
          class="placeholder"
          style="display:none"
        >
          NAZRA
        </div>

      </div>

      <div class="card-info">

        <div class="card-name">
          ${p.name}
        </div>

        <div class="price">
          ${p.price} EGP
        </div>

        <button
          class="add"
          data-product="${p.id}"
        >
          ADD TO CART
        </button>

      </div>

    </article>

  `).join("");

  document.querySelectorAll(".add").forEach(button => {

    button.onclick = () => {

      addToCart(
        Number(button.dataset.product)
      );

    };

  });

}


/* CART */

function addToCart(id){

  const product = products.find(
    p => p.id === id
  );

  cart.push(product);

  updateCart();

  openCart();

}


function updateCart(){

  cartCount.textContent = cart.length;

}


function openCart(){

  let body = cart.length

    ? cart.map((p,i) => `

      <div class="cart-row">

        <span>

          ${p.name}

          <br>

          <small>
            ${p.price} EGP
          </small>

        </span>

        <button
          onclick="
            cart.splice(${i},1);
            updateCart();
            openCart();
          "
        >
          ×
        </button>

      </div>

    `).join("")

    : `

      <div class="cart-empty">
        Your cart is empty
      </div>

    `;


  const total = cart.reduce(
    (sum,p) => sum + p.price,
    0
  );


  openModal(

    shell(

      "CART",

      `

      ${body}

      <div class="total">

        <b>
          TOTAL
        </b>

        <b>
          ${total} EGP
        </b>

      </div>

      ${
        cart.length

        ?

        '<button class="submit" onclick="openCheckout()">CHECKOUT</button>'

        :

        ''
      }

      `

    )

  );

}


/* PHONE */

function validPhone(value){

  return /^01\d{9}$/.test(value);

}


/* CHECKOUT */

function openCheckout(){

  openModal(

    shell(

      "CHECKOUT",

      `

      <form id="checkoutForm">

        <div class="form-grid">

          <div class="field">

            <label>
              FULL NAME <span class="req">*</span>
            </label>

            <input
              name="name"
              required
            >

          </div>


          <div class="field">

            <label>
              PHONE <span class="req">*</span>
            </label>

            <input
              name="phone"
              inputmode="numeric"
              maxlength="11"
              required
            >

          </div>


          <div class="field">

            <label>
              EMAIL <span class="req">*</span>
            </label>

            <input

/* REPORT FORM */

function reportForm(type){

  const configs = {

    order:[
      "ORDER NUMBER",
      "FULL NAME",
      "PHONE NUMBER",
      "DESCRIBE THE ISSUE",
      "UPLOAD PHOTO (OPTIONAL)"
    ],

    payment:[
      "ORDER NUMBER",
      "PAYMENT METHOD",
      "FULL NAME",
      "PHONE NUMBER",
      "DESCRIBE THE ISSUE",
      "PAYMENT SCREENSHOT"
    ],

    delivery:[
      "ORDER NUMBER",
      "FULL NAME",
      "PHONE NUMBER",
      "DELIVERY ADDRESS",
      "DESCRIBE THE ISSUE"
    ],

    product:[
      "ORDER NUMBER",
      "FULL NAME",
      "PHONE NUMBER",
      "PRODUCT NAME",
      "DESCRIBE THE ISSUE",
      "PHOTOS OF THE PRODUCT"
    ],

    other:[
      "FULL NAME",
      "PHONE NUMBER",
      "DESCRIBE THE ISSUE"
    ]

  };


  const fields = configs[type].map(label => {

    const name =
      label
      .toLowerCase()
      .replaceAll(" ","_")
      .replace(/[()]/g,"");


    if(label === "PAYMENT METHOD"){

      return `

        <div class="field">

          <label>
            ${label}
            <span class="req">*</span>
          </label>

          <select
            name="${name}"
            required
          >

            <option value="">
              Select
            </option>

            <option>
              Vodafone Cash
            </option>

            <option>
              InstaPay
            </option>

            <option>
              Cash on Delivery
            </option>

          </select>

        </div>

      `;

    }


    if(
      label.includes("SCREENSHOT") ||
      label.includes("PHOTOS")
    ){

      return `

        <div class="field full">

          <label>

            ${label}
            <span class="req">*</span>

          </label>

          <input
            type="file"
            name="${name}"
            accept="image/*"
            required
          >

        </div>

      `;

    }


    if(label.includes("OPTIONAL")){

      return `

        <div class="field full">

          <label>
            ${label}
          </label>

          <input
            type="file"
            name="${name}"
            accept="image/*"
          >

        </div>

      `;

    }


    if(
      label.includes("DESCRIBE") ||
      label.includes("ADDRESS")
    ){

      return `

        <div class="field full">

          <label>

            ${label}
            <span class="req">*</span>

          </label>

          <textarea
            name="${name}"
            required
          ></textarea>

        </div>

      `;

    }


    return `

      <div class="field">

        <label>

          ${label}
          <span class="req">*</span>

        </label>

        <input
          name="${name}"
          ${
            label === "PHONE NUMBER"
            ?
            'inputmode="numeric" maxlength="11"'
            :
            ''
          }
          required
        >

      </div>

    `;

  }).join("");


  reportArea.innerHTML = `

    <a
      class="back-link"
      href="#"
      onclick="
        reports();
        return false
      "
    >
      ← BACK
    </a>


    <form id="reportForm">

      <div class="form-grid">

        ${fields}

      </div>


      <button
        class="submit"
        disabled
        id="reportSubmit"
      >
        CONFIRM REPORT
      </button>

    </form>

  `;


  const form =
    document.getElementById(
      "reportForm"
    );


  const btn =
    document.getElementById(
      "reportSubmit"
    );


  function check(){

    let ok =
      [...form.querySelectorAll("[required]")]
      .every(x => {

        if(x.type === "file"){

          return x.files.length;

        }

        return x.value.trim();

      });


    const phone =
      form.querySelector(
        '[name="phone_number"]'
      );


    if(
      phone &&
      phone.value &&
      !validPhone(phone.value)
    ){

      ok = false;

    }


    btn.disabled = !ok;

  }


  form.addEventListener(
    "input",
    check
  );


  form.addEventListener(
    "change",
    check
  );


  form.onsubmit = e => {

    e.preventDefault();


    if(btn.disabled){
      return;
    }


    openModal(

      shell(

        "REPORT SENT",

        `

        <div
          style="
            text-align:center;
            color:#bbb;
            line-height:1.7
          "
        >

          Your report has been submitted.

          <br>

          NAZRA will review the issue.

        </div>

        `

      )

    );

  };

}

/* FRANCO + ENGLISH AI */

function botReply(q){

  const s =
    q.toLowerCase();


  if(
    /exchange|بدل|استبدال|el exchange|momken/.test(s)
  ){

    return "Aywa, momken within 10 days mn date of delivery بشرط en el piece tkoun b7altaha el aslya w ma tkounsh etlbest aw etghaslet w ykoon el tags w packaging mawgoodin.";

  }


  if(
    /delivery|توصيل|الشحن|يوصل|بياخد|el delivery/.test(s)
  ){

    return "Delivery time depends on your location and will be confirmed with you after placing your order.";

  }


  if(
    /payment|دفع|فلوس|vodafone|instapay|فودافون|انستا/.test(s)
  ){

    return "You can pay through Vodafone Cash, InstaPay or Cash on Delivery.";

  }


  if(
    /order|اوردر|طلب|اطلب|اعمل/.test(s)
  ){

    return "Choose your piece, select the size and color, then add it to your cart and complete the checkout.";

  }


  if(
    /return|refund|استرجاع|ارجع/.test(s)
  ){

    return "NAZRA does not offer refunds. Exchanges only.";

  }


  if(
    /worn|washed|اتلبس|اتغسل/.test(s)
  ){

    return "No. The piece must be unworn, unwashed, undamaged and in its original condition with the original tags and packaging.";

  }


  if(
    /contact|تواصل|كلم|انست/.test(s)
  ){

    return "You can contact NAZRA through the Contact section on the website.";

  }


  return "I am not sure about that yet. Please contact NAZRA through the Contact section and we will help you.";

}
