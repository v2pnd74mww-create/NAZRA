<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAZRA</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#050505;
    color:#f4f1eb;
    overflow:hidden;
    font-family:'Montserrat',sans-serif;
}

/* BACKGROUND */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255,255,255,.055),
            transparent 28%
        ),
        linear-gradient(
            120deg,
            #030303,
            #0b0b0b 48%,
            #030303
        );
    pointer-events:none;
}

/* SIDE LINE */

.side-line{
    position:fixed;
    left:42px;
    top:50%;
    transform:translateY(-50%);
    height:180px;
    width:1px;
    background:rgba(255,255,255,.18);
}

.side-line::before{
    content:"";
    position:absolute;
    left:-1px;
    top:0;
    width:1px;
    height:55px;
    background:#fff;
}

/* MAIN */

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    z-index:2;
}

.hero-content{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* SMALL TOP TEXT */

.eyebrow{
    font-size:9px;
    letter-spacing:6px;
    font-weight:400;
    opacity:.45;
    margin-bottom:25px;
}

/* LOGO */

.logo{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(90px,15vw,190px);
    font-weight:400;
    letter-spacing:10px;
    line-height:.75;
    margin-left:10px;
}

.subtitle{
    margin-top:35px;
    font-size:9px;
    letter-spacing:7px;
    opacity:.45;
}

/* SPECIAL BUTTON */

.collection-btn{
    position:relative;
    margin-top:55px;
    width:245px;
    height:64px;
    border:1px solid rgba(255,255,255,.25);
    background:transparent;
    color:#fff;
    cursor:pointer;
    overflow:hidden;
    transition:.5s ease;
}

/* INNER */

.collection-btn span{
    position:relative;
    z-index:3;
    font-size:10px;
    letter-spacing:4px;
    font-weight:400;
    transition:.5s ease;
}

/* MOVING BACKGROUND */

.collection-btn::before{
    content:"";
    position:absolute;
    left:-110%;
    top:0;
    width:100%;
    height:100%;
    background:#f4f1eb;
    transition:.6s cubic-bezier(.77,0,.18,1);
}

/* TOP LINE */

.collection-btn::after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:0;
    height:1px;
    background:#fff;
    transition:.6s ease;
}

/* HOVER */

.collection-btn:hover::before{
    left:0;
}

.collection-btn:hover::after{
    width:100%;
}

.collection-btn:hover span{
    color:#050505;
    letter-spacing:5px;
}

/* ARROW */

.arrow{
    position:absolute;
    right:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:14px;
    z-index:4;
    opacity:.5;
    transition:.5s ease;
}

.collection-btn:hover .arrow{
    color:#050505;
    right:12px;
    opacity:1;
}

/* CORNERS */

.corner{
    position:absolute;
    width:7px;
    height:7px;
    border-color:rgba(255,255,255,.6);
    transition:.5s ease;
}

.corner.tl{
    left:-1px;
    top:-1px;
    border-left:1px solid;
    border-top:1px solid;
}

.corner.tr{
    right:-1px;
    top:-1px;
    border-right:1px solid;
    border-top:1px solid;
}

.corner.bl{
    left:-1px;
    bottom:-1px;
    border-left:1px solid;
    border-bottom:1px solid;
}

.corner.br{
    right:-1px;
    bottom:-1px;
    border-right:1px solid;
    border-bottom:1px solid;
}

.collection-btn:hover .corner{
    width:14px;
    height:14px;
}

/* BOTTOM */

.bottom-mark{
    position:fixed;
    bottom:28px;
    right:38px;
    font-family:'Cormorant Garamond',serif;
    font-size:13px;
    letter-spacing:5px;
    opacity:.35;
}

/* MOBILE */

@media(max-width:600px){

    .side-line{
        left:18px;
        height:130px;
    }

    .logo{
        font-size:82px;
        letter-spacing:5px;
    }

    .eyebrow{
        letter-spacing:4px;
    }

    .subtitle{
        letter-spacing:4px;
        font-size:8px;
    }

    .collection-btn{
        width:220px;
        height:60px;
    }

    .bottom-mark{
        right:20px;
        bottom:20px;
    }

}

</style>
</head>

<body>

<div class="side-line"></div>

<main class="hero">

    <div class="hero-content">

        <div class="eyebrow">
            THE FIRST COLLECTION
        </div>

        <div class="logo">
            NAZRA
        </div>

        <div class="subtitle">
            LOOK TWICE
        </div>

        <button class="collection-btn" onclick="document.getElementById('shop').scrollIntoView({behavior:'smooth'})">

            <span>TO COLLECTIONS</span>

            <b class="arrow">→</b>

            <i class="corner tl"></i>
            <i class="corner tr"></i>
            <i class="corner bl"></i>
            <i class="corner br"></i>

        </button>

    </div>

</main>

<div class="bottom-mark">
    NAZRA
</div>

</body>
</html>
