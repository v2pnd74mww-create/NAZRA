<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAZRA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #050505;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}

/* HEADER */
header {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 10;
  display: flex;
  justify-content: flex-end;
  padding: 22px 20px;
}

nav {
  display: flex;
  gap: 22px;
}

nav a {
  font-size: 12px;
  letter-spacing: 2px;
}

/* HOME */
.hero {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 20px;
  background:
    radial-gradient(circle at center, #181818 0%, #080808 45%, #000 100%);
}

.hero-content {
  width: 100%;
  max-width: 500px;
}

.hero-tag {
  font-size: 11px;
  letter-spacing: 5px;
  color: #aaa;
  margin-bottom: 25px;
}

.hero-logo {
  width: 82%;
  max-width: 420px;
  max-height: 210px;
  object-fit: contain;
  display: block;
  margin: 0 auto 40px;
}

.shop-btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  min-width: 220px;
  height: 64px;
  background: #fff;
  color: #000;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 4px;
}

/* COLLECTION */
.collection {
  min-height: 100vh;
  padding: 80px 18px;
  background: #050505;
}

.section-title {
  text-align: center;
  font-family: Georgia, serif;
  font-size: 32px;
  letter-spacing: 6px;
  margin-bottom: 35px;
}

.products {
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 520px;
  margin: auto;
}

.card {
  background: #101010;
  border: 1px solid #242424;
  overflow: hidden;
}

.product-photo {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at center, #292929 0%, #151515 40%, #080808 100%);
}

.product-logo {
  width: 45%;
  max-width: 180px;
  height: auto;
}

.card-info {
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-name {
  font-size: 13px;
  letter-spacing: 2px;
}

.price {
  font-size: 13px;
  color: #aaa;
}

/* CONTACT */
.contact {
  min-height: 100vh;
  padding: 90px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090909;
}

.contact-box {
  width: 100%;
  max-width: 500px;
  text-align: center;
}

.contact-title {
  font-family: Georgia, serif;
  font-size: 38px;
  letter-spacing: 6px;
  margin-bottom: 35px;
}

.contact-list {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.contact-link {
  display: block;
  padding: 20px 15px;
  background: #111;
  border: 1px solid #292929;
  font-size: 14px;
}

.contact-link span {
  display: block;
  color: #888;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 7px;
  text-transform: uppercase;
}

.back {
  display: inline-block;
  margin-top: 30px;
  color: #888;
  font-size: 11px;
  letter-spacing: 2px;
}

/* FOOTER */
footer {
  padding: 30px 15px;
  text-align: center;
  color: #666;
  font-size: 10px;
  letter-spacing: 2px;
}

/* DESKTOP */
@media (min-width: 700px) {
  .products {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    max-width: 1100px;
  }
}
</style>
</head>

<body>

<header>
  <nav>
    <a href="#shop">SHOP</a>
    <a href="#contact">CONTACT</a>

</section>

      <a

</section>


<footer>
  NAZRA © 2026 — ALL RIGHTS RESERVED
</footer>

</body>
</html>
